[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-metric-harvest"
version = "0.1.0"
description = "VCF Operations Metrics Explorer: discover objects, pick metrics, and export historical performance data."
readme = "README.md"
authors = [
    { name = "Scott Robert Bowe" },
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["PySide6>=6.6,<7", "tzdata>=2024.1; sys_platform == 'win32'"]

[project.scripts]
ops-metric-harvest = "ops_metric_harvest.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "pyyaml>=6.0",
]
yaml = [
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["ops_metric_harvest*"]

[tool.setuptools.package-data]
"ops_metric_harvest.gui" = ["assets/*.qss", "assets/*.json"]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter
        run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0

      - name: Run automated test suite
        run: make test

  build-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -e ".[dev]"

      - name: Build standalone executable
        run: python packaging/build.py

      - name: Smoke test built executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/ops-metric-harvest.exe --help
            ./dist/ops-metric-harvest.exe profiles validate examples/profiles/scenario_a_all_hosts.json
          else
            ./dist/ops-metric-harvest --help
            ./dist/ops-metric-harvest profiles validate examples/profiles/scenario_a_all_hosts.json
          fi

      - name: Install headless GUI runtime (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xfixes0 libfontconfig1 libglib2.0-0t64 libdbus-1-3

      - name: Render packaged native connection screen (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./dist/ops-metric-harvest gui --screenshot connection.png

      - name: Render packaged native connection screen (Windows and macOS)
        if: runner.os != 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/ops-metric-harvest.exe gui --screenshot connection.png
          else
            ./dist/ops-metric-harvest gui --screenshot connection.png
          fi

      - name: Upload native connection screenshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-connection-${{ runner.os }}
          path: connection.png
          if-no-files-found: error

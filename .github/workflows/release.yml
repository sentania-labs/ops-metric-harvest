name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate tag format and ancestry
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag '$TAG' does not follow semantic versioning (vMAJOR.MINOR.PATCH)." >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Error: Tagged commit $GITHUB_SHA is not an ancestor of origin/main." >&2
            exit 1
          }

  build-release-artifacts:
    needs: validate-tag
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ops-metric-harvest-linux-x64
            target_binary: ops-metric-harvest
          - os: windows-latest
            artifact_name: ops-metric-harvest-windows-x64.exe
            target_binary: ops-metric-harvest.exe
          - os: macos-latest
            artifact_name: ops-metric-harvest-macos-arm64
            target_binary: ops-metric-harvest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -e ".[yaml]"

      - name: Build standalone executable
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          MACOS_CERTIFICATE_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          GPG_KEY: ${{ secrets.GPG_KEY }}
        run: python packaging/build.py

      - name: Smoke test executable
        shell: bash
        run: |
          ./dist/${{ matrix.target_binary }} --help
          ./dist/${{ matrix.target_binary }} profiles validate examples/profiles/scenario_a_all_hosts.json

      - name: Install headless GUI runtime (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1

      - name: Smoke native desktop window
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a ./dist/${{ matrix.target_binary }} gui --screenshot connection.png
          else
            QT_QPA_PLATFORM=offscreen ./dist/${{ matrix.target_binary }} gui --screenshot connection.png
          fi

      - name: Stage named release artifact
        shell: bash
        run: |
          cp "dist/${{ matrix.target_binary }}" "dist/${{ matrix.artifact_name }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256
            dist/manifest-*.json

  publish-github-release:
    needs: build-release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate unified checksum manifest
        run: |
          cd release-assets
          cat -- *.sha256 > SHA256SUMS.txt || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cd release-assets
          FILES=(*)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ops-metric-harvest $TAG" \
              --generate-notes
          fi

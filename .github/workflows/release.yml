name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format and ancestry
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag '$TAG' does not follow semantic versioning (vMAJOR.MINOR.PATCH)." >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Error: Tagged commit $GITHUB_SHA is not an ancestor of origin/main." >&2
            exit 1
          }

  build-release-artifacts:
    needs: validate-tag
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: ops-metric-harvest-linux-x64
            target_binary: ops-metric-harvest
          - os: windows-latest
            artifact_name: ops-metric-harvest-windows-x64.exe
            target_binary: ops-metric-harvest.exe
          - os: macos-latest
            artifact_name: ops-metric-harvest-macos-arm64
            target_binary: ops-metric-harvest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build standalone executable
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          MACOS_CERTIFICATE_IDENTITY: ${{ secrets.MACOS_CERTIFICATE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: python packaging/build.py

      - name: Smoke test executable
        shell: bash
        run: |
          ./dist/${{ matrix.target_binary }} --help
          ./dist/${{ matrix.target_binary }} profiles validate examples/profiles/scenario_a_all_hosts.json

      - name: Stage named release artifact
        shell: bash
        run: |
          cp "dist/${{ matrix.target_binary }}" "dist/${{ matrix.artifact_name }}"
          cd dist && sha256sum "${{ matrix.artifact_name }}" > "${{ matrix.artifact_name }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256
            dist/manifest-*.json

  publish-github-release:
    needs: build-release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate unified checksum manifest
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
